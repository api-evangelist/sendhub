aid: sendhub
name: SendHub
description: >-
  SendHub is a business text messaging platform for SMS/MMS marketing campaigns, two-way
  texting, appointment reminders, bulk messaging, SMS surveys, group messaging, and VoIP
  calling, used by more than 10,000 businesses. It exposes a REST-like v1 API at
  api.sendhub.com for programmatically managing contacts, groups, messages, inbox threads,
  account settings, and enterprise users, authenticated with a line username and API key
  (query params) or HTTP Basic. Published plans run Lite $19/mo to Basic $100/mo plus a
  quoted Custom tier, and every tier lists API access, though the developer page still says
  API access is custom-plan only. SendHub also supports 100+ integrations via direct
  connectors and Zapier plus inbound-SMS webhooks, and is a New Era Technology company.
  Surfaced as a 500 Global portfolio company and enriched by the API Evangelist pipeline.
