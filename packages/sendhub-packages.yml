notes: >-
  SendHub ships exactly one first-party client library — a Python client in its own GitHub
  organization (github.com/Sendhub). It is NOT published to any package registry
  (pypi.org/pypi/sendhub/json returns 404), so it must be installed from source and has no
  registry metadata endpoint to date it; version and date below are read from the repo's own
  VERSION file and its last code commit. The last functional commit landed 2021-04-30 and the
  declared version is still 0.0.23, i.e. the only first-party SDK for this API has not shipped a
  change in over five years while the v1 API it wraps is still live. Two same-named packages on
  public registries are NOT SendHub's and are deliberately excluded from `official`: the RubyGems
  gem `sendhub` (0.2.1, 2017-03-28) belongs to a different company, sendhub.NET, by author
  Richard Taylor, and the npm package `sendhub` is a 2013 third-party client whose source repo
  (cgarvis/node-sendhub) now 404s.
